<meta name="robots" content="noindex, nofollow">
<title>Beta Feedback Closed | QariAI</title>
<meta name="description" content="The QariAI beta feedback form is closed. Email salam@qariai.app with any feedback.">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf8ee;
    --card: #fffdf8;
    --green: #0c6b48;
    --green-hover: #0b5a3d;
    --ink: #12251b;
    --muted: #5c665c;
    --border: rgba(18, 37, 27, 0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  .qbrand { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; line-height: 1; margin-bottom: 48px; }
  .qbrand__mark { display: block; width: 50px; height: 42px; object-fit: contain; }
  .qbrand__wordmark { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 900; letter-spacing: -.055em; color: #171b19; }
  .qbrand__wordmark-ai { color: #15988f; margin-left: 3px; }
  main {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 28px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(18, 37, 27, 0.06);
  }
  h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 12px; }
  p { font-size: 16px; line-height: 1.6; color: var(--muted); margin-bottom: 28px; }
  .email { color: var(--ink); font-weight: 600; }
  .button {
    display: inline-block;
    background: var(--green);
    color: #fffdf8;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    padding: 14px 32px;
    border-radius: 40px;
    transition: background 0.15s;
  }
  .button:hover, .button:focus-visible { background: var(--green-hover); }
  .button:focus-visible { outline: 3px solid rgba(12, 107, 72, 0.35); outline-offset: 3px; }
  .home { display: inline-block; margin-top: 20px; font-size: 14px; color: var(--muted); }
  .home:hover { color: var(--green); }
</style>
</head>
<body>
  <a class="qbrand" href="/" aria-label="QariAI home">
    <img class="qbrand__mark" src="/images/qariai-logo-mark.webp" alt="" width="100" height="84">
    <span class="qbrand__wordmark">Qari<span class="qbrand__wordmark-ai">AI</span></span>
  </a>
  <main>
    <h1>Beta feedback is closed</h1>
    <p>Thank you to everyone who helped shape QariAI during the beta. We still read every message, so please email us at <span class="email">salam@qariai.app</span>.</p>
    <a class="button" href="mailto:salam@qariai.app?subject=QariAI%20feedback" onclick="if(window.gtag)gtag('event','feedback_email_click')">Email us</a>
    <br>
    <a class="home" href="/">Back to qariai.app</a>
  </main>
</body>
</html>
