<!DOCTYPE html>
<html lang="en">
<!--
  OG IMAGE TEMPLATE — 1200 x 630px (render at 2x -> screenshots/og-image.png)
  Render: node -e "require('playwright').chromium.launch().then(async b=>{const p=await b.newPage({viewport:{width:1200,height:630},deviceScaleFactor:2});await p.goto('file://'+process.cwd()+'/screenshots/og-image.html');await p.waitForTimeout(500);await p.screenshot({path:'screenshots/og-image.png'});await b.close()})"
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;background:#fdf8ee;color:#12251b;position:relative}
body::before{content:'';position:absolute;inset:0;background:
  radial-gradient(520px 420px at 82% 55%,rgba(244,196,86,.28),transparent 70%),
  radial-gradient(600px 400px at 0% 100%,rgba(18,146,94,.10),transparent 70%);}
.left{position:absolute;left:72px;top:0;bottom:0;width:600px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:34px;font-weight:800;font-size:30px;letter-spacing:-.01em}
.brand img{width:46px;height:46px;border-radius:12px}
.brand b{color:#12925e;font-weight:800}
h1{font-family:Lora,Georgia,serif;font-weight:700;font-size:66px;line-height:1.04;letter-spacing:-.03em}
h1 em{font-style:normal;color:#0c6b48}
p{margin-top:22px;font-size:25px;line-height:1.45;color:#4a544c;max-width:520px}
.chips{display:flex;gap:10px;margin-top:30px}
.chips span{font-size:18px;font-weight:600;color:#0c6b48;background:#e6f2ea;border:1px solid rgba(12,107,72,.18);border-radius:999px;padding:9px 18px}
.hero{position:absolute;right:20px;top:20px;height:590px}
</style>
</head>
<body>
<div class="left">
  <div class="brand"><img src="../uploads/logo.png" alt=""/><span>Qari<b>AI</b></span></div>
  <h1>Fix your Tajweed, <em>sound by sound.</em></h1>
  <p>The AI Quran recitation coach. Free to try on Google Play.</p>
  <div class="chips"><span>16 Tajweed rules</span><span>Real-time feedback</span></div>
</div>
<img class="hero" src="../uploads/qariai-hero-phone-hudhud-v3.png" alt=""/>
</body>
</html>
